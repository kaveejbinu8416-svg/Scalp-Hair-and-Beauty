name: Deploy static content to Pages

on:
  push:
    branches: ['main'] # Change to 'master' if your main branch is called master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Direct upload of root files, bypassing the broken compiler
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
